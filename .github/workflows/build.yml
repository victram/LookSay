name: Build downloads

# Builds the Windows installer and the macOS app on GitHub's machines.
# Runs on every "v*" tag (and publishes a Release) or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a GitHub Release (e.g. 0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in pyinstaller pytest
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build executable
        run: pyinstaller packaging/looksay.spec --noconfirm
      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } elseif ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "0.8.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          Compress-Archive -Path dist\LookSay -DestinationPath dist\LookSay-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LookSay-windows
          path: |
            dist/LookSay-*-setup.exe
            dist/LookSay-windows-portable.zip
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in pyinstaller pillow
      - name: Build app
        run: |
          pyinstaller packaging/looksay.spec --noconfirm
          ditto -c -k --keepParent dist/LookSay.app dist/LookSay-macos.zip
          # Disk image: open it and drag LookSay to Applications (no unzipping needed).
          mkdir dmg && cp -R dist/LookSay.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname LookSay -srcfolder dmg -ov -format UDZO dist/LookSay-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LookSay-macos
          path: |
            dist/LookSay-macos.dmg
            dist/LookSay-macos.zip

  release:
    # Publishes direct download links (no GitHub login needed) on the Releases page.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          name: LookSay ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** download `LookSay-*-setup.exe` and run it (or the portable zip).
            **Mac (Apple chip M1 or later):** download `LookSay-macos.dmg`, open it and drag LookSay to Applications.
            The app is not signed: on Windows choose "More info → Run anyway"; on Mac use
            System Settings → Privacy & Security → "Open Anyway".
          files: out/*
