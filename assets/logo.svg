<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>LookSay</title>
  <desc>An eye whose iris is a microphone.</desc>
  <defs>
    <clipPath id="eye">
      <path d="M36 256 C130 110 382 110 476 256 C382 402 130 402 36 256 Z"/>
    </clipPath>
  </defs>
  <!-- Eye white -->
  <path d="M36 256 C130 110 382 110 476 256 C382 402 130 402 36 256 Z" fill="#fff"/>
  <!-- Iris, clipped by the eyelids -->
  <g clip-path="url(#eye)">
    <circle cx="256" cy="256" r="112" fill="#000"/>
  </g>
  <!-- Microphone inside the iris -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="13">
    <path d="M204 238 v10 a52 52 0 0 0 104 0 v-10"/>
    <line x1="256" y1="300" x2="256" y2="326"/>
    <line x1="228" y1="326" x2="284" y2="326"/>
  </g>
  <rect x="226" y="172" width="60" height="100" rx="30" fill="#fff"/>
  <g stroke="#000" stroke-width="6" stroke-linecap="round">
    <line x1="238" y1="204" x2="274" y2="204"/>
    <line x1="238" y1="222" x2="274" y2="222"/>
    <line x1="238" y1="240" x2="274" y2="240"/>
  </g>
  <!-- Eye outline drawn last so it sits on top of the iris edge -->
  <path d="M36 256 C130 110 382 110 476 256 C382 402 130 402 36 256 Z" fill="none" stroke="#000"
        stroke-width="22" stroke-linejoin="round"/>
</svg>
